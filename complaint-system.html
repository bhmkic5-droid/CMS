<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Product Complaint Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        /* Filter Bar */
        .filter-bar {
            background: white;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .filter-bar label {
            font-weight: 600;
            color: #555;
        }

        .filter-bar select, .filter-bar input {
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .filter-bar select:focus, .filter-bar input:focus {
            border-color: #667eea;
        }

        .btn-add {
            margin-left: auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
        }

        /* Stats Cards */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        /* Complaints Grid */
        .complaints-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .complaint-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .complaint-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .complaint-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .complaint-id {
            font-weight: bold;
            color: #667eea;
            font-size: 14px;
        }

        .complaint-date {
            font-size: 12px;
            color: #999;
        }

        .complaint-product {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .complaint-customer {
            color: #666;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .complaint-description {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .priority-high {
            background: #fee;
            color: #e74c3c;
        }

        .priority-medium {
            background: #fff3e0;
            color: #f39c12;
        }

        .priority-low {
            background: #e8f8f5;
            color: #27ae60;
        }

        .status-pending {
            background: #fee;
            color: #e74c3c;
        }

        .status-progress {
            background: #e3f2fd;
            color: #3498db;
        }

        .status-resolved {
            background: #e8f8f5;
            color: #27ae60;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            color: #333;
        }

        .close-btn {
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-primary, .btn-secondary {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-primary:hover, .btn-secondary:hover {
            opacity: 0.9;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 1100;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Detail View */
        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-label {
            width: 120px;
            font-weight: 600;
            color: #555;
        }

        .detail-value {
            flex: 1;
            color: #333;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .complaints-grid {
                grid-template-columns: 1fr;
            }
            
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn-add {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📱 Product Complaint Management System</h1>
            <p>Manage complaints for ATMs, MIB-11, Token Machines, and more</p>
        </div>

        <!-- Stats -->
        <div class="stats" id="stats">
            <div class="stat-card">
                <h3>Total Complaints</h3>
                <div class="number" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <div class="number" id="pendingCount">0</div>
            </div>
            <div class="stat-card">
                <h3>In Progress</h3>
                <div class="number" id="progressCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Resolved</h3>
                <div class="number" id="resolvedCount">0</div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <label>Filter by Status:</label>
            <select id="statusFilter">
                <option value="all">All Complaints</option>
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="resolved">Resolved</option>
            </select>
            
            <label>Product Type:</label>
            <select id="productFilter">
                <option value="all">All Products</option>
                <option value="ATM">ATM</option>
                <option value="MIB-11">MIB-11</option>
                <option value="TOKEN MACHINE">Token Machine</option>
                <option value="POS Machine">POS Machine</option>
                <option value="Cash Counter">Cash Counter</option>
            </select>
            
            <input type="text" id="searchInput" placeholder="🔍 Search by customer or ID..." style="flex: 1;">
            
            <button class="btn-add" onclick="openAddModal()">+ New Complaint</button>
        </div>

        <!-- Complaints Grid -->
        <div id="complaintsGrid" class="complaints-grid"></div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="complaintModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Register New Complaint</h2>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="complaintForm">
                    <input type="hidden" id="complaintId">
                    
                    <div class="form-group">
                        <label>Customer Name *</label>
                        <input type="text" id="customerName" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="tel" id="customerPhone" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="customerEmail">
                    </div>
                    
                    <div class="form-group">
                        <label>Product Type *</label>
                        <select id="productType" required>
                            <option value="ATM">ATM</option>
                            <option value="MIB-11">MIB-11</option>
                            <option value="TOKEN MACHINE">Token Machine</option>
                            <option value="POS Machine">POS Machine</option>
                            <option value="Cash Counter">Cash Counter</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Product Serial Number *</label>
                        <input type="text" id="serialNumber" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Priority *</label>
                        <select id="priority">
                            <option value="High">High</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Complaint Description *</label>
                        <textarea id="description" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="saveComplaint()">Submit Complaint</button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Complaint Details</h2>
                <span class="close-btn" onclick="closeDetailModal()">&times;</span>
            </div>
            <div class="modal-body" id="detailContent">
                <!-- Dynamic content -->
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeDetailModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Data storage
        let complaints = [];
        let nextId = 1;

        // Load data from localStorage
        function loadData() {
            const stored = localStorage.getItem('complaints');
            if (stored) {
                complaints = JSON.parse(stored);
                nextId = Math.max(...complaints.map(c => c.id), 0) + 1;
            } else {
                // Add sample data
                complaints = [
                    {
                        id: 1,
                        customerName: "John Doe",
                        customerPhone: "+1234567890",
                        customerEmail: "john@example.com",
                        productType: "ATM",
                        serialNumber: "ATM-001",
                        description: "Screen not responding to touch",
                        priority: "High",
                        status: "pending",
                        createdAt: new Date(Date.now() - 86400000).toISOString(),
                        remarks: "",
                        resolvedAt: null
                    },
                    {
                        id: 2,
                        customerName: "Jane Smith",
                        customerPhone: "+1987654321",
                        customerEmail: "jane@example.com",
                        productType: "MIB-11",
                        serialNumber: "MIB-002",
                        description: "Device not powering on",
                        priority: "Medium",
                        status: "in-progress",
                        createdAt: new Date(Date.now() - 172800000).toISOString(),
                        remarks: "Technician dispatched",
                        resolvedAt: null
                    }
                ];
                nextId = 3;
                saveData();
            }
            renderComplaints();
            updateStats();
        }

        // Save data to localStorage
        function saveData() {
            localStorage.setItem('complaints', JSON.stringify(complaints));
        }

        // Update statistics
        function updateStats() {
            const total = complaints.length;
            const pending = complaints.filter(c => c.status === 'pending').length;
            const progress = complaints.filter(c => c.status === 'in-progress').length;
            const resolved = complaints.filter(c => c.status === 'resolved').length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('progressCount').textContent = progress;
            document.getElementById('resolvedCount').textContent = resolved;
        }

        // Render complaints grid
        function renderComplaints() {
            const statusFilter = document.getElementById('statusFilter').value;
            const productFilter = document.getElementById('productFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = complaints;
            
            if (statusFilter !== 'all') {
                filtered = filtered.filter(c => c.status === statusFilter);
            }
            
            if (productFilter !== 'all') {
                filtered = filtered.filter(c => c.productType === productFilter);
            }
            
            if (searchTerm) {
                filtered = filtered.filter(c => 
                    c.customerName.toLowerCase().includes(searchTerm) ||
                    c.id.toString().includes(searchTerm) ||
                    c.serialNumber.toLowerCase().includes(searchTerm)
                );
            }
            
            const grid = document.getElementById('complaintsGrid');
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No complaints found</h3>
                        <p>Click "New Complaint" to register a complaint</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = filtered.map(complaint => `
                <div class="complaint-card" onclick="viewDetails(${complaint.id})">
                    <div class="complaint-header">
                        <span class="complaint-id">#${complaint.id}</span>
                        <span class="complaint-date">${formatDate(complaint.createdAt)}</span>
                    </div>
                    <div class="complaint-product">${complaint.productType}</div>
                    <div class="complaint-customer">
                        👤 ${complaint.customerName} | 🏷️ ${complaint.serialNumber}
                    </div>
                    <div class="complaint-description">${complaint.description.substring(0, 80)}${complaint.description.length > 80 ? '...' : ''}</div>
                    <div class="badges">
                        <span class="badge priority-${complaint.priority.toLowerCase()}">${complaint.priority}</span>
                        <span class="badge status-${complaint.status}">${getStatusText(complaint.status)}</span>
                    </div>
                </div>
            `).join('');
        }
        
        function getStatusText(status) {
            const statusMap = {
                'pending': 'Pending',
                'in-progress': 'In Progress',
                'resolved': 'Resolved'
            };
            return statusMap[status] || status;
        }
        
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }
        
        // Open add modal
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Register New Complaint';
            document.getElementById('complaintForm').reset();
            document.getElementById('complaintId').value = '';
            document.getElementById('complaintModal').classList.add('active');
        }
        
        // Close modal
        function closeModal() {
            document.getElementById('complaintModal').classList.remove('active');
        }
        
        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }
        
        // Save complaint
        function saveComplaint() {
            const id = document.getElementById('complaintId').value;
            const complaintData = {
                customerName: document.getElementById('customerName').value,
                customerPhone: document.getElementById('customerPhone').value,
                customerEmail: document.getElementById('customerEmail').value,
                productType: document.getElementById('productType').value,
                serialNumber: document.getElementById('serialNumber').value,
                description: document.getElementById('description').value,
                priority: document.getElementById('priority').value,
            };
            
            // Validation
            if (!complaintData.customerName || !complaintData.customerPhone || !complaintData.serialNumber || !complaintData.description) {
                showToast('Please fill all required fields', 'error');
                return;
            }
            
            if (id) {
                // Update existing
                const index = complaints.findIndex(c => c.id == id);
                if (index !== -1) {
                    complaints[index] = { ...complaints[index], ...complaintData };
                    showToast('Complaint updated successfully', 'success');
                }
            } else {
                // Add new
                const newComplaint = {
                    id: nextId++,
                    ...complaintData,
                    status: 'pending',
                    createdAt: new Date().toISOString(),
                    remarks: '',
                    resolvedAt: null
                };
                complaints.push(newComplaint);
                showToast('Complaint registered successfully!', 'success');
            }
            
            saveData();
            renderComplaints();
            updateStats();
            closeModal();
        }
        
        // View details
        function viewDetails(id) {
            const complaint = complaints.find(c => c.id === id);
            if (!complaint) return;
            
            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
                <div class="detail-section">
                    <h4>📋 Complaint Information</h4>
                    <div class="detail-row">
                        <div class="detail-label">Complaint ID:</div>
                        <div class="detail-value">#${complaint.id}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Status:</div>
                        <div class="detail-value">
                            <select id="statusUpdate" onchange="updateStatus(${complaint.id}, this.value)" style="padding: 5px; border-radius: 5px;">
                                <option value="pending" ${complaint.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="in-progress" ${complaint.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                                <option value="resolved" ${complaint.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                            </select>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Priority:</div>
                        <div class="detail-value">
                            <span class="badge priority-${complaint.priority.toLowerCase()}">${complaint.priority}</span>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Created:</div>
                        <div class="detail-value">${formatDate(complaint.createdAt)}</div>
                    </div>
                    ${complaint.resolvedAt ? `<div class="detail-row">
                        <div class="detail-label">Resolved:</div>
                        <div class="detail-value">${formatDate(complaint.resolvedAt)}</div>
                    </div>` : ''}
                </div>
                
                <div class="detail-section">
                    <h4>👤 Customer Information</h4>
                    <div class="detail-row">
                        <div class="detail-label">Name:</div>
                        <div class="detail-value">${complaint.customerName}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Phone:</div>
                        <div class="detail-value">${complaint.customerPhone}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Email:</div>
                        <div class="detail-value">${complaint.customerEmail || 'Not provided'}</div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h4>🔧 Product Information</h4>
                    <div class="detail-row">
                        <div class="detail-label">Product Type:</div>
                        <div class="detail-value">${complaint.productType}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Serial Number:</div>
                        <div class="detail-value">${complaint.serialNumber}</div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h4>📝 Complaint Details</h4>
                    <div class="detail-row">
                        <div class="detail-label">Description:</div>
                        <div class="detail-value">${complaint.description}</div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h4>💬 Remarks</h4>
                    <textarea id="remarksInput" placeholder="Add remarks here..." rows="3" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">${complaint.remarks || ''}</textarea>
                    <button class="btn-primary" onclick="addRemark(${complaint.id})" style="margin-top: 10px;">Save Remark</button>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-secondary" onclick="deleteComplaint(${complaint.id})">Delete Complaint</button>
                </div>
            `;
            
            document.getElementById('detailModal').classList.add('active');
        }
        
        // Update status
        function updateStatus(id, newStatus) {
            const index = complaints.findIndex(c => c.id === id);
            if (index !== -1) {
                complaints[index].status = newStatus;
                if (newStatus === 'resolved') {
                    complaints[index].resolvedAt = new Date().toISOString();
                }
                saveData();
                renderComplaints();
                updateStats();
                showToast('Status updated successfully', 'success');
                viewDetails(id); // Refresh detail view
            }
        }
        
        // Add remark
        function addRemark(id) {
            const remark = document.getElementById('remarksInput').value;
            const index = complaints.findIndex(c => c.id === id);
            if (index !== -1) {
                complaints[index].remarks = remark;
                saveData();
                showToast('Remark added successfully', 'success');
                viewDetails(id); // Refresh detail view
            }
        }
        
        // Delete complaint
        function deleteComplaint(id) {
            if (confirm('Are you sure you want to delete this complaint?')) {
                complaints = complaints.filter(c => c.id !== id);
                saveData();
                renderComplaints();
                updateStats();
                closeDetailModal();
                showToast('Complaint deleted successfully', 'success');
            }
        }
        
        // Show toast notification
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            toast.style.background = type === 'error' ? '#e74c3c' : '#27ae60';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        // Event listeners
        document.getElementById('statusFilter').addEventListener('change', renderComplaints);
        document.getElementById('productFilter').addEventListener('change', renderComplaints);
        document.getElementById('searchInput').addEventListener('input', renderComplaints);
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }
        
        // Initialize
        loadData();
    </script>
</body>
</html>
